[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manufactured-move"
version = "0.1.0"
description = "A simulation of the SEBI/Jane Street expiry-day strategy: move the spot in the cash market so a larger options book pays."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilesh Gahlot", email = "nileshgahlot09@gmail.com" }]
keywords = ["quant", "market-microstructure", "options", "market-impact", "manipulation", "simulation"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
